version: '3.8'

services:
  backend:
    build:
      context: ./services/api-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_pos.db
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./services/api-server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./apps/dashboard-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./apps/dashboard-web:/app
    command: npm run dev

  pos-simulator:
    build:
      context: ./services/api-server
      dockerfile: Dockerfile.simulator
    volumes:
      - ./services/api-server:/app
    command: python pos_terminal.py
    depends_on:
      - backend
