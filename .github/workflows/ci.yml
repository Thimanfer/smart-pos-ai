name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/services/api-server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-server/requirements.txt

      - name: Apply Alembic migrations
        working-directory: services/api-server
        env:
          DATABASE_URL: sqlite:///./smart_pos.db
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: services/api-server
        env:
          DATABASE_URL: sqlite:///./smart_pos.db
        run: |
          pytest -q
